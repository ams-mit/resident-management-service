openapi: 3.0.3
info:
  title: Resident Management Service API
  description: Canonical target-state API documentation for Resident Management Service in Project A (Group 1 - Apartment Identity and Resident Management).
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Local development server
  - url: http://localhost:8000
    description: API Gateway route

paths:
  /api/v1/residents:
    get:
      tags:
        - Residents
      summary: "RES-001: List resident profiles"
      description: Retrieve paginated resident profiles. Requires User JWT with role SYSTEM_ADMINISTRATOR or APARTMENT_MANAGER.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (0-indexed, default 0)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Page size (1-100, default 20)
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          description: Filter by profile status (ACTIVE, INACTIVE, ARCHIVED)
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, ARCHIVED]
        - name: search
          in: query
          description: Search term across firstName, lastName, or email
          required: false
          schema:
            type: string
        - name: userId
          in: query
          description: Filter by Identity Access user ID (UUID)
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Residents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResidentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
        - Residents
      summary: "RES-002: Create resident profile"
      description: Creates a new resident profile. Validates user existence with identity-access-service via internal API.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Resident profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResidentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found in Identity Access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Resident profile already exists for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Identity service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/residents/{residentId}:
    get:
      tags:
        - Residents
      summary: "RES-003: Get resident profile"
      description: Retrieve a specific resident profile. Allowed for SYSTEM_ADMINISTRATOR, APARTMENT_MANAGER, or the resident user themselves.
      security:
        - BearerAuth: []
      parameters:
        - name: residentId
          in: path
          required: true
          description: Resident profile UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resident retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResidentResponse'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Resident not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    patch:
      tags:
        - Residents
      summary: "RES-004: Update resident profile"
      description: Update resident profile fields. Allowed for SYSTEM_ADMINISTRATOR, APARTMENT_MANAGER, or self-service update.
      security:
        - BearerAuth: []
      parameters:
        - name: residentId
          in: path
          required: true
          description: Resident profile UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResidentRequest'
      responses:
        '200':
          description: Resident profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResidentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Resident not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

