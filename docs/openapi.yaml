  /api/v1/internal/residents/{residentId}/validate:
    get:
      tags:
        - Internal
      summary: "RES-INT-001: Validate resident profile"
      description: Validates that a resident profile exists and is active. Accessible only by registered Project A backend services using Service JWT via API Gateway.
      security:
        - BearerAuth: []
      parameters:
        - name: residentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resident validation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentValidationApiResponse'
        '401':
          description: Invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Caller service not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Resident not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/internal/users/{userId}/relationships:
    get:
      tags:
        - Internal
      summary: "RES-INT-002: Get user relationships"
      description: Retrieves all resident-domain relationships owned by Resident Management for a user. Accessible by registered backend services using Service JWT via API Gateway.
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User relationships retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRelationshipsApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Caller service not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT token issued/resigned by API Gateway. User JWT for public endpoints, Service JWT for internal endpoints.

  schemas:
    ProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]

    CreateProfileRequest:
      type: object
      required:
        - userId
        - firstName
        - lastName
        - email
      properties:
        userId:
          type: string
          format: uuid
          description: Identity Access user UUID
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    UpdateResidentRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    ResidentValidationResponse:
      type: object
      properties:
        residentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        exists:
          type: boolean
        active:
          type: boolean

    RelationshipItem:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
        profileType:
          type: string
          enum: [RESIDENT, OWNER, TENANT, STAFF]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]

    UserRelationshipsData:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipItem'

    PagedData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProfileResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    SingleResidentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ProfileResponse'
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    PagedResidentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/PagedData'
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ResidentValidationApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ResidentValidationResponse'
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    UserRelationshipsApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserRelationshipsData'
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        details:
          nullable: true

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid
